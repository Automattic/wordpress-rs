[package]
name = "wp_mobile"
version = "0.1.0"
edition = "2024"

[features]
default = ["aes-gcm-encryption"]
aes-gcm-encryption = ["dep:aes-gcm", "dep:hkdf"]
reqwest-request-executor = ["wp_api/reqwest-request-executor"]
export-uncancellable-endpoints = ["wp_api/export-uncancellable-endpoints"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "wp_mobile"

[dependencies]
aes-gcm = { workspace = true, optional = true }
base64 = { workspace = true }
hkdf = { workspace = true, optional = true }
# `scraper` stores attribute names as `html5ever` types, and doesn't re-export them. Adding an
# attribute needs the same `html5ever` version `scraper` uses, so bump the two together.
html5ever = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
paste = { workspace = true }
rand = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
uniffi = { workspace = true }
url = { workspace = true }
wp_api = { path = "../wp_api" }
wp_localization = { path = "../wp_localization" }
wp_localization_macro = { path = "../wp_localization_macro" }
wp_mobile_cache = { path = "../wp_mobile_cache" }

[dev-dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
indoc = { workspace = true }
rstest = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
wp_mobile_cache = { path = "../wp_mobile_cache", features = ["test-helpers"] }

[build-dependencies]
uniffi = { workspace = true , features = [ "build", "cli" ] }
