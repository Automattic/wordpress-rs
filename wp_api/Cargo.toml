[package]
name = "wp_api"
version = "0.1.0"
edition = "2021"

[features]
integration-tests = []
reqwest-request-executor = ["dep:reqwest"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "wp_api"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = [ "serde" ] }
futures = { workspace = true }
http = { workspace = true }
indoc = { workspace = true }
url = { workspace = true }
parse_link_header = { workspace = true }
paste = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = [ "multipart", "json", "stream", "gzip", "brotli", "zstd", "deflate" ], optional = true }
scraper = { workspace = true }
serde = { workspace = true, features = [ "derive", "rc" ] }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
uniffi = { workspace = true }
uuid = { workspace = true, features = [ "v4" ] }
wp_contextual = { path = "../wp_contextual" }
wp_derive = { path = "../wp_derive" }
wp_derive_request_builder = { path = "../wp_derive_request_builder", features = [ "generate_request_builder" ] }
wp_localization = { path = "../wp_localization" }
wp_localization_macro = { path = "../wp_localization_macro" }
wp_serde_helper = { path = "../wp_serde_helper" }
x509-cert = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
rstest_reuse = { workspace = true }

[build-dependencies]
uniffi = { workspace = true , features = [ "build", "cli" ] }
