[workspace]
members = [
  "integration_test_credentials",
  "wp_api",
  "wp_api_integration_tests",
  "wp_api_integration_tests_backend",
  "wp_cli",
  "wp_com_e2e",
  "wp_contextual",
  "wp_derive",
  "wp_derive_request_builder",
  "wp_localization",
  "wp_localization_macro",
  "wp_localization_parser",
  "wp_localization_validation",
  "wp_mobile",
  "wp_mobile_cache",
  "wp_rs_cli",
  "wp_rs_web",
  "wp_serde_helper",
  "wp_uniffi_bindgen",
  "xcframework",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
clap = "4.5"
colored = "3.0"
convert_case = "0.9"
csv = "1.4"
fluent-bundle = "0.16"
fluent-langneg = "0.13"
fluent-syntax = "0.12"
fluent-templates = "0.13"
futures = "0.3"
h2 = "0.4"
hickory-resolver = "0.24" # 0.25 breaks the ability to detect DNS Errors, so we shouldn't update until that's fixed
http = "1.3"
hyper = "1.1" # Use the same version as `reqwest`: https://github.com/seanmonstar/reqwest/blob/v0.12.15/Cargo.toml#L121
hyper-util = "0.1.18"
indoc = "2.0"
itertools = "0.14.0"
linkify = "0.10.0"
parse_link_header = "0.4"
paste = "1.0"
proc-macro-crate = "3.4.0"
rand = "0.8"
proc-macro2 = "1.0"
quote = "1.0"
regex = "1.12"
reqwest = "0.12.24"
rocket = "0.5"
rocket_dyn_templates = "0.2.0"
roxmltree = "0.21"
rstest = "0.26"
rstest_reuse = "0.7.0"
rusqlite = "0.37.0"
rustls = "0.23.35"
scraper = "0.24"
semver = "1.0"
serde = "1.0"
serde_json = "1.0"
serde_repr = "0.1"
serde_urlencoded = "0.7"
serial_test = "3.2"
strum = "0.27"
strum_macros = "0.27"
syn = "2.0"
thiserror = "2.0"
tokio = "1.48"
tokio-stream = "0.1.17"
toml = "0.9"
trybuild = "1.0"
unic-langid = "0.9"
uniffi = "0.30.0"
url = "2.5"
uuid = "1.18"
x509-cert = "0.3.0-pre.0"
