[workspace]
members = [
  "integration_test_credentials",
  "wp_api",
  "wp_api_integration_tests",
  "wp_api_integration_tests_backend",
  "wp_mobile_integration_tests",
  "wp_cli",
  "wp_com_e2e",
  "wp_contextual",
  "wp_derive",
  "wp_derive_request_builder",
  "wp_localization",
  "wp_localization_macro",
  "wp_localization_parser",
  "wp_localization_validation",
  "wp_mobile",
  "wp_mobile_cache",
  "wp_rs_cli",
  "wp_rs_web",
  "wp_serde_helper",
  "wp_uniffi_bindgen",
  "xcframework",
]
resolver = "3"

# Test binaries carry line tables instead of full debug info, which caps the
# memory a `cargo test` link consumes on CI. Backtraces still resolve to file
# and line; a debugger can no longer print locals or format values. For a
# debugging session, override per invocation:
#
#   CARGO_PROFILE_TEST_DEBUG=full cargo test
#
# This profile covers every crate a `cargo test` run builds, dependencies
# included — not just the crate under test.
[profile.test]
debug = "line-tables-only"

[workspace.dependencies]
aes-gcm = "0.11"
android_logger = "0.15"
anyhow = "1.0"
async-trait = "0.1"
# `default-features = false` drops the default-on `simd-unsafe` feature: we only
# use the scalar `STANDARD` engine, and with `simd-unsafe` off base64 is
# `#![forbid(unsafe_code)]`. `std` keeps the scalar encode/decode API.
base64 = { version = "0.23", default-features = false, features = ["std"] }
chrono = "0.4"
clap = "4.6"
colored = "3.1"
convert_case = "0.12"
csv = "1.4"
fluent-bundle = "0.16"
fluent-langneg = "0.13"
fluent-syntax = "0.12"
fluent-templates = "0.13"
futures = "0.3"
h2 = "0.4"
hkdf = "0.13"
http = "1.4"
hyper = "1.1" # Use the same version as `reqwest`: https://github.com/seanmonstar/reqwest/blob/v0.13.4/Cargo.toml
hyper-util = "0.1.20"
indoc = "2.0"
itertools = "0.15.0"
linkify = "0.11.0"
log = "0.4"
oslog = "0.2"
parse_link_header = "0.4"
paste = "1.0"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0"
quote = "1.0"
rand = "0.10"
regex = "1.12"
reqwest = "0.13.4"
rocket = "0.5"
rocket_dyn_templates = "0.2.0"
roxmltree = "0.21"
rstest = "0.26"
rstest_reuse = "0.7.0"
rusqlite = "0.40.2"
rustls = "0.23.40"
scraper = "0.27"
semver = "1.0"
serde = "1.0"
serde_json = "1.0"
serde_repr = "0.1"
serde_urlencoded = "0.7"
serial_test = "4.0"
sha2 = "0.11"
strum = "0.28"
strum_macros = "0.28"
syn = "3.0"
tempfile = "3"
thiserror = "2.0"
tokio = "1.52"
tokio-stream = "0.1.18"
toml = "1.1"
trybuild = "1.0"
unic-langid = "0.9"
uniffi = "0.32.0"
url = "2.5"
uuid = "1.23"
x509-cert = "0.3.0-pre.0"
zeroize = "1"
