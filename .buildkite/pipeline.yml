env:
  IMAGE_ID: $IMAGE_ID

# TEMPORARY – every step here measures how long a Docker-based test suite takes with the test
# database on disk (as on trunk) or in memory (this PR). The full pipeline will be restored afterwards.
steps:
  - label: ":stopwatch: :rust: database on disk"
    command: .buildkite/commands/benchmark-docker-suite.sh rust disk
    parallelism: 10
    env:
      WORDPRESS_VERSION: "6.8.1"

  - label: ":stopwatch: :rust: database in memory"
    command: .buildkite/commands/benchmark-docker-suite.sh rust tmpfs
    parallelism: 10
    env:
      WORDPRESS_VERSION: "6.8.1"

  - label: ":stopwatch: :kotlin: database on disk"
    command: .buildkite/commands/benchmark-docker-suite.sh kotlin disk
    parallelism: 10
    env:
      WORDPRESS_VERSION: "6.8.1"

  - label: ":stopwatch: :kotlin: database in memory"
    command: .buildkite/commands/benchmark-docker-suite.sh kotlin tmpfs
    parallelism: 10
    env:
      WORDPRESS_VERSION: "6.8.1"
