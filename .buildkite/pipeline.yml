env:
  IMAGE_ID: $IMAGE_ID

steps:
  # Experiment 1: Run ALL SE tests (single + 15 concurrent + 15 serialized + timeout)
  # via swift test with NO filter. If the cooperative pool hypothesis is correct,
  # this should hang because the 15 concurrent tests exhaust the thread pool.
  - label: ":lock: Exp 1: All SE tests (swift test, no filter)"
    command: |
      echo "--- :lock: Running swift test on minimal SE package (all suites)"
      cd .buildkite/se-investigation
      swift test 2>&1
    timeout_in_minutes: 5
    agents:
      queue: mac

  # Experiment 2: Code signing comparison (always useful data)
  - label: ":mag: Exp 2: Code signing comparison"
    command: .buildkite/se_codesign_check.sh
    timeout_in_minutes: 5
    agents:
      queue: mac
