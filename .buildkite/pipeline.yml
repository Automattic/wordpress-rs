env:
  IMAGE_ID: $IMAGE_ID

# TEMP: everything except the step being iterated on is removed – restore the full pipeline before
# merging.
steps:
  - label: ":wordpress: :swift: :darwin: WordPress {{matrix}}"
    command: |
      .buildkite/commands/run-swift-integration-tests-native.sh

      # TEMP: repeat the tests to find out whether any of them are flaky in the VM
      failures=0
      for run in $$(seq 1 20); do
        echo "--- 🧪 Repeat run $$run"
        make test-swift-integration-native || failures=$$((failures + 1))
      done
      echo "+++ $$failures of 20 repeat runs failed"
      [ "$$failures" -eq 0 ]
    env:
      WORDPRESS_VERSION: "{{matrix}}"
    matrix:
      - "6.8.1"
    artifact_paths:
      - ".wordpress/logs/*.log"
    agents:
      queue: mac
