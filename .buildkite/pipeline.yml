env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: ":lock: Test Secure Enclave availability on CI Mac"
    command: |
      echo "--- :information_source: System info"
      system_profiler SPHardwareDataType
      sw_vers

      echo "--- :lock: Testing single Secure Enclave key creation"
      swift .buildkite/se_test_single.swift

      echo "--- :lock: Testing 15 concurrent Secure Enclave key creations"
      swift .buildkite/se_test_concurrent.swift
    agents:
      queue: mac
