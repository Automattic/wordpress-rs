env:
  IMAGE_ID: $IMAGE_ID

# TEMPORARY – every other step is disabled while iterating on the native test server. The full
# pipeline will be restored before this is ready for review.
steps:
  - label: ":mag: Probe macOS agent"
    command: .buildkite/commands/probe-macos-agent.sh
    agents:
      queue: mac

  - label: ":wordpress: :rust: :darwin: WordPress {{matrix}}"
    command: ".buildkite/commands/run-integration-tests-native.sh rust"
    env:
      WORDPRESS_VERSION: "{{matrix}}"
    matrix:
      - "6.8.1"
    artifact_paths:
      - ".wordpress/logs/*.log"
    agents:
      queue: mac

  - label: ":wordpress: :kotlin: :darwin: WordPress {{matrix}}"
    command: ".buildkite/commands/run-integration-tests-native.sh kotlin"
    env:
      WORDPRESS_VERSION: "{{matrix}}"
    matrix:
      - "6.8.1"
    plugins:
      - $CI_TOOLKIT
      - $TEST_COLLECTOR:
          files: "native/kotlin/api/kotlin/build/test-results/integrationTest/*.xml"
          format: "junit"
    artifact_paths:
      - ".wordpress/logs/*.log"
      - "native/kotlin/api/kotlin/build/test-results/integrationTest/*.xml"
    agents:
      queue: mac
