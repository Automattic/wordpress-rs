env:
  IMAGE_ID: $IMAGE_ID

# Nodes with values to reuse in the pipeline.
common_params:
  matrix: &wordpress_version_matrix
    - "6.8.1"

# TEMPORARY – measuring what `--debug-no-sync` does for the Docker test server's database. The full
# pipeline will be restored afterwards.
steps:
  - group: ":wordpress: End-to-end Tests"
    key: "e2e"
    steps:
      - label: ":stopwatch: Docker restore benchmark"
        command: .buildkite/commands/benchmark-docker-restore.sh
        env:
          WORDPRESS_VERSION: "6.8.1"

      - label: ":wordpress: :rust: WordPress {{matrix}} (debug-no-sync)"
        command: |
          printf 'services:\n    database:\n        command: --debug-no-sync\n' > docker-compose.override.yml

          # Give read/write permissions to `./` for all users
          chmod -R a+rw ./

          echo "--- :docker: Setting up Test Server"
          make test-server

          echo "--- 🧪 Running Rust Integration Tests"
          make test-rust-integration
        env:
          WORDPRESS_VERSION: "{{matrix}}"
        matrix: *wordpress_version_matrix

      - label: ":wordpress: :kotlin: WordPress {{matrix}} (debug-no-sync)"
        command: |
          printf 'services:\n    database:\n        command: --debug-no-sync\n' > docker-compose.override.yml
          .buildkite/commands/run-kotlin-integration-tests.sh
        env:
          WORDPRESS_VERSION: "{{matrix}}"
        matrix: *wordpress_version_matrix

      - label: ":wordpress: :swift: WordPress {{matrix}} (debug-no-sync)"
        command: |
          printf 'services:\n    database:\n        command: --debug-no-sync\n' > docker-compose.override.yml
          .buildkite/commands/run-swift-tests-linux.sh
        env:
          WORDPRESS_VERSION: "{{matrix}}"
        matrix: *wordpress_version_matrix

      # The macOS VMs can't run Docker, so this installs the test server straight into the VM
      - label: ":wordpress: :rust: :darwin: WordPress {{matrix}}"
        command: ".buildkite/commands/run-rust-integration-tests-native.sh"
        env:
          WORDPRESS_VERSION: "{{matrix}}"
        matrix: *wordpress_version_matrix
        artifact_paths:
          - ".wordpress/logs/*.log"
        agents:
          queue: mac
