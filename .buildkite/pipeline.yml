steps:
  - label: ":lock: Test Secure Enclave availability on CI Mac"
    command: |
      echo "--- :information_source: System info"
      system_profiler SPHardwareDataType
      sw_vers

      echo "--- :lock: Testing Secure Enclave key creation (single)"
      cat > /tmp/se_test_single.swift << 'SWIFT'
      import CryptoKit
      import Foundation

      print("SecureEnclave.isAvailable: \(SecureEnclave.isAvailable)")

      guard SecureEnclave.isAvailable else {
          print("Secure Enclave is not available on this machine.")
          exit(0)
      }

      print("Attempting single SecureEnclave.P256.KeyAgreement.PrivateKey()...")

      let done = DispatchSemaphore(value: 0)
      var succeeded = false

      DispatchQueue.global().async {
          do {
              let key = try SecureEnclave.P256.KeyAgreement.PrivateKey()
              print("KEY_CREATED: \(key.publicKey.x963Representation.base64EncodedString())")
              succeeded = true
          } catch {
              print("ERROR: \(error)")
          }
          done.signal()
      }

      if done.wait(timeout: .now() + .seconds(10)) == .timedOut {
          print("HANG: Single key creation did not complete within 10 seconds.")
          exit(1)
      } else if succeeded {
          print("SUCCESS: Single key creation works.")
      } else {
          print("FAILED: Single key creation threw an error.")
          exit(1)
      }
      SWIFT
      swift /tmp/se_test_single.swift

      echo "--- :lock: Testing concurrent Secure Enclave key creation (15 simultaneous)"
      cat > /tmp/se_test_concurrent.swift << 'SWIFT'
      import CryptoKit
      import Foundation

      let count = 15
      print("Attempting \(count) concurrent SecureEnclave.P256.KeyAgreement.PrivateKey() calls...")
      print("This simulates what happens when Swift Testing runs ~15 SecureEnclave")
      print("tests concurrently, each creating its own key.")
      print("")

      let group = DispatchGroup()
      let queue = DispatchQueue(label: "se-test", attributes: .concurrent)
      let lock = NSLock()
      var results: [(Int, String)] = []

      for i in 0..<count {
          group.enter()
          queue.async {
              let start = Date()
              do {
                  let key = try SecureEnclave.P256.KeyAgreement.PrivateKey()
                  let elapsed = Date().timeIntervalSince(start)
                  let pubkey = key.publicKey.x963Representation.prefix(8).map { String(format: "%02x", $0) }.joined()
                  lock.lock()
                  results.append((i, String(format: "OK  (%.2fs) key=%s...", elapsed, pubkey)))
                  lock.unlock()
              } catch {
                  let elapsed = Date().timeIntervalSince(start)
                  lock.lock()
                  results.append((i, String(format: "ERR (%.2fs) %s", elapsed, "\(error)")))
                  lock.unlock()
              }
              group.leave()
          }
      }

      let timeout: DispatchTimeoutResult = group.wait(timeout: .now() + .seconds(30))

      lock.lock()
      let finalResults = results.sorted { $0.0 < $1.0 }
      lock.unlock()

      for (i, msg) in finalResults {
          print("  [\(i)] \(msg)")
      }

      if timeout == .timedOut {
          let completed = finalResults.count
          print("")
          print("HANG: Only \(completed)/\(count) key creations completed within 30 seconds.")
          print("This confirms that concurrent Secure Enclave key creation deadlocks.")
          exit(1)
      } else {
          print("")
          print("SUCCESS: All \(count) concurrent key creations completed.")
      }
      SWIFT
      swift /tmp/se_test_concurrent.swift
    agents:
      queue: mac
