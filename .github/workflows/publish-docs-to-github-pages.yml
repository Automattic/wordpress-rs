name: Documentation

on:
  push:
    branches:
      - trunk
  # Exercises the build job on changes to its setup. Only a push to trunk deploys.
  pull_request:
    paths:
      - .github/workflows/publish-docs-to-github-pages.yml
      - rust-toolchain.toml

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        # rust-cache hashes every installed toolchain, so drop the runner image's `stable`.
        run: |
          rustup toolchain uninstall stable
          rustup toolchain install
      - name: Configure cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clean docs folder
        run: cargo clean --doc
      - name: Build docs
        run: cargo doc -p wp_api --no-deps
      - name: Add redirect
        run: echo '<meta http-equiv="refresh" content="0;url=wp_api/index.html">' > target/doc/index.html
      - name: Remove lock file
        run: rm target/doc/.lock
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc
  deploy:
    name: Deploy
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
