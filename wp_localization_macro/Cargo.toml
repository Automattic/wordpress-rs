quote = { workspace = true }
syn = { workspace = true, features = ["extra-traits"] }

[dev-dependencies]
rstest = { workspace = true }
serde_json = { workspace = true }
trybuild = { workspace = true, features = ["diff"] }
wp_serde_helper = { path = "../wp_serde_helper" }
