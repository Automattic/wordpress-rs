[package]
name = "wp_com_e2e"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
integration_test_credentials = { path = "../integration_test_credentials" }
libtest-mimic = "0.8"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true }
wp_api = { path = "../wp_api", features = [ "reqwest-request-executor" ] }
wp_mobile = { path = "../wp_mobile" }
wp_mobile_cache = { path = "../wp_mobile_cache" }

[[bin]]
name = "wp_com_e2e"

# Runs the Reader endpoints against a large amount of real data. See its module docs.
[[bin]]
name = "reader_sweep"
path = "src/bin/reader_sweep/main.rs"

# Walks an account's whole notification history. See its module docs.
[[bin]]
name = "notifications_sweep"
path = "src/bin/notifications_sweep/main.rs"
